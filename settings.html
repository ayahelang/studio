<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Settings</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/settings.css">

</head>

<body>

<div class="wrapper">

<aside id="sidebar" class="sidebar"></aside>

<main class="content">

<header id="navbar"></header>

<h1>Settings</h1>

<p class="page-description">

Pengaturan SilverTube Studio.

</p>

<div class="settings-grid">

<div class="settings-card">

<h2>Workspace</h2>

<label>Workspace Name</label>

<input id="workspaceName" value="SilverTube Studio">

<label>YouTube Channel</label>

<input id="channelName" value="Teddy Mulyana PMA">

<label>Default Language</label>

<select id="language">

<option>Indonesia</option>

<option>English</option>

</select>

</div>

<div class="settings-card">

<h2>Preferences</h2>

<label>

<input type="checkbox" checked>

Dark Mode

</label>

<label>

<input type="checkbox" checked>

Notification

</label>

<label>

<input type="checkbox">

Auto Publish

</label>

<button id="saveSettings">

Save Settings

</button>

</div>

</div>

</main>

</div>

<script type="module">

import {renderSidebar} from "./js/components/sidebar.js";
import {renderNavbar} from "./js/components/navbar.js";
import {renderSettings} from "./js/modules/settings.js";

renderSidebar();
renderNavbar("Settings");
renderSettings();

</script>

</body>

</html>
