<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dashboard - SilverTube Studio</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="wrapper">

<aside class="sidebar" id="sidebar"></aside>

<main class="content">

<header id="navbar"></header>

<section class="stats" id="stats"></section>

<section class="dashboard-body">

<div class="left-column">

<div class="card">

<h2>📂 Active Projects</h2>

<div id="projectList"></div>

</div>

<div class="card">

<h2>🔥 Recent Activities</h2>

<div id="activityFeed"></div>

</div>

</div>

<div class="right-column">

<div class="card">

<h2>📅 Today's Target</h2>

<div id="todayTarget"></div>

</div>

<div class="card">

<h2>🏆 Top Contributors</h2>

<div id="leaderboardMini"></div>

</div>

</div>

</section>

</main>

</div>

<script type="module">

import {renderSidebar} from "./js/components/sidebar.js";
import {renderNavbar} from "./js/components/navbar.js";
import {renderDashboard} from "./js/modules/dashboard.js";

renderSidebar();
renderNavbar("Dashboard");
renderDashboard();

</script>

</body>

</html>
